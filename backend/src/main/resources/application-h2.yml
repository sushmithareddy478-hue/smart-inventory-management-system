server:
  port: 8080
  servlet:
    context-path: /api/v1

spring:
  config:
    activate:
      on-profile: h2

  datasource:
    url: jdbc:h2:mem:inventory_pro;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    defer-datasource-initialization: true

  sql:
    init:
      mode: always
      schema-locations: classpath:db/migration/V1__init_schema.sql
      data-locations: classpath:db/migration/V2__seed_demo_data.sql

  flyway:
    enabled: false

  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true

# Security & OpenAPI settings remain fully functional
app:
  jwt:
    secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    expiration-ms: 86400000
  cors:
    allowed-origins: http://localhost:5173,http://localhost:3000,http://localhost:80
