services:
  # Local MySQL container (fallback if not connecting directly to Aiven Cloud MySQL)
  mysql:
    image: mysql:8.0
    container_name: inventory-pro-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${DB_NAME:-inventory_pro}
      MYSQL_USER: ${DB_USER:-appuser}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - inventory-net

  # Java Spring Boot 3 Backend API with Spring AI
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: inventory-pro-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PORT: 8080
      # Can point to mysql container or Aiven Cloud MySQL host
      DB_HOST: ${DB_HOST:-mysql}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:-inventory_pro}
      DB_USER: ${DB_USER:-appuser}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      DB_SSL_MODE: ${DB_SSL_MODE:-PREFERRED} # Set REQUIRED when connecting to Aiven
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-mock-key}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      CORS_ALLOWED_ORIGINS: "http://localhost,http://localhost:80,http://localhost:5173"
    ports:
      - "8080:8080"
    networks:
      - inventory-net

  # React + Vite Frontend served via Nginx
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: inventory-pro-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
    networks:
      - inventory-net

volumes:
  mysql_data:

networks:
  inventory-net:
    driver: bridge
